appId: ru.sorbentopt.manager
productName: SorbentOpt Manager
directories:
  buildResources: build
  output: release
files:
  - out/**
  - package.json
asar: true
# нативных модулей у приложения нет (SSH — чистый JavaScript), поэтому компилятор на компьютере не нужен
npmRebuild: false
win:
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
